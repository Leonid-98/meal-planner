<helmet>
  <style>
/* Tokens lifted from budget-app/app/static/app.css (light + dark, teal accent) */
:root, .app {
  --bg: #F4F5FA; --surface: #FFFFFF; --surface2: #F0F1F8; --ink: #191C28; --muted: #656A7E;
  --line: #E6E8F0; --leader: #D6D9E6; --accent: #0E8F7E; --accent-ink: #FFFFFF; --accent-soft: #DEF2EE;
  --good: #148A52; --good-bg: #DFF5E9; --warn: #A96A00; --warn-bg: #FFF0D6; --danger: #C23B2E; --danger-bg: #FBE8E4;
  --p1: #0E8F7E; --p1-bg: #DEF2EE; --p2: #5B4DD3; --p2-bg: #ECE9FB;
  --backdrop: rgba(25, 28, 40, 0.4);
  --shadow: 0 2px 6px rgba(25, 28, 40, 0.05), 0 12px 32px rgba(25, 28, 40, 0.08);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.app.dark {
  --bg: #14161E; --surface: #1D2029; --surface2: #262A36; --ink: #E9EAF2; --muted: #9CA1B5;
  --line: #2E3341; --leader: #3D4354; --accent: #4CC8B4; --accent-ink: #0C1714; --accent-soft: #163A34;
  --good: #43C98E; --good-bg: #143327; --warn: #E8B45C; --warn-bg: #3A2C13; --danger: #F08B7F; --danger-bg: #43201B;
  --p1: #4CC8B4; --p1-bg: #163A34; --p2: #9A8FF0; --p2-bg: #2B2750;
  --backdrop: rgba(0, 0, 0, 0.6);
  --shadow: 0 2px 6px rgba(0, 0, 0, 0.35), 0 12px 32px rgba(0, 0, 0, 0.3);
}
* { box-sizing: border-box; }
body { margin: 0; background: #F4F5FA; }
a { color: var(--accent); } a:hover { color: var(--ink); }
.app {
  position: relative; background: var(--bg); color: var(--ink); font-family: var(--sans);
  font-size: 15px; line-height: 1.45; padding: 0 20px 64px; min-height: 900px; overflow: hidden;
}
.shell { max-width: 1240px; margin: 0 auto; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.lg { width: 20px; height: 20px; }
svg.i.xl { width: 24px; height: 24px; }
.tab { font-variant-numeric: tabular-nums; }

/* ---------- top bar (budget-app anatomy) ---------- */
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0 14px; border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; letter-spacing: 0.01em; display: flex; align-items: center; gap: 8px; font-size: 1.05rem; }
.brand .version { font-size: 0.68rem; font-weight: 400; color: var(--muted); align-self: flex-end; padding-bottom: 2px; }
.brand-mark { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; }
.nav { display: flex; align-items: center; gap: 4px; margin: 0 auto; font-size: 0.92rem; }
.nav a { color: var(--muted); text-decoration: none; padding: 5px 12px; border-radius: 999px; }
.nav a.current { color: var(--ink); font-weight: 700; background: var(--surface2); }
.weeknav { display: flex; align-items: baseline; gap: 14px; font-size: 0.92rem; }
.weeknav .adjacent { color: var(--muted); text-decoration: none; }
.weeknav .current { font-weight: 700; font-size: 1.05rem; }
.icon-btn { background: var(--surface); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 14px; font-size: 0.86rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.user-chip { background: var(--accent-soft); border: 1px solid var(--accent-soft); color: var(--accent); font-weight: 700; border-radius: 999px; padding: 6px 16px; font-size: 0.86rem; cursor: pointer; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 0 22px; }
.spacer { flex: 1; }

/* ---------- buttons, inputs, chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 7px 16px; font-size: 0.86rem; cursor: pointer; text-decoration: none; text-align: center; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 4px 12px; font-size: 0.8rem; }
.btn.danger { color: var(--danger); }
.ghost { background: none; border: 1px dashed var(--leader); color: var(--muted); border-radius: 999px; padding: 3px 12px; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.in { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 0.88rem; min-width: 0; display: inline-flex; align-items: center; gap: 8px; }
.in.ph { color: var(--muted); }
.in.focus { border-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.field .in { color: var(--ink); font-weight: 400; }
.grp { display: inline-block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 12px; }
.tagchip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; font-weight: 600; color: var(--muted); background: var(--surface2); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.tagchip.on { color: var(--accent); background: var(--accent-soft); }
.tagchip.filter { font-size: 0.8rem; padding: 4px 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; cursor: pointer; }
.tagchip.filter.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.68rem; font-weight: 600; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.badge.warn { color: var(--warn); background: var(--warn-bg); }
.badge.good { color: var(--good); background: var(--good-bg); }
.badge.soft { color: var(--accent); background: var(--accent-soft); }
.badge.muted { color: var(--muted); background: var(--surface2); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; }
.stepper b { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 400; }
.stepper span { min-width: 34px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.9rem; }
.switch { width: 36px; height: 22px; border-radius: 999px; background: var(--leader); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
.switch.on { background: var(--accent); } .switch.on::after { left: 17px; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--leader); flex: none; }
.radio.on { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 45%, transparent 50%); }
.check { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--leader); flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--accent-ink); }
.check.on { border-color: var(--accent); background: var(--accent); }

/* ---------- avatars, macros ---------- */
.avs { display: inline-flex; gap: 2px; }
.av { width: 18px; height: 18px; border-radius: 50%; font-size: 0.6rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; }
.av.p1 { background: var(--p1-bg); color: var(--p1); }
.av.p2 { background: var(--p2-bg); color: var(--p2); }
.av.g { background: var(--surface2); color: var(--muted); padding: 0 4px; width: auto; border-radius: 999px; }
.av.lg { width: 26px; height: 26px; font-size: 0.74rem; }
.kcal { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.macros { display: inline-flex; gap: 10px; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.macros b { color: var(--ink); font-weight: 600; }
.bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--p1); }
.bar.p2 i { background: var(--p2); }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.card.flat { box-shadow: none; }
.card-pad { padding: 16px 22px; }
h1, h2, h3, h4 { margin: 0; }
h2 { font-size: 1.05rem; } h3 { font-size: 0.92rem; } h4 { font-size: 0.78rem; font-weight: 700; }
.muted { color: var(--muted); } .small { font-size: 0.8rem; } .xs { font-size: 0.72rem; }

/* ---------- week grid ---------- */
.week { display: grid; grid-template-columns: 78px repeat(7, minmax(0, 1fr)); }
.week .corner { background: var(--accent-soft); }
.week .dayhead { padding: 10px 10px; font-weight: 700; background: var(--accent-soft); font-size: 0.86rem; display: flex; align-items: baseline; gap: 6px; }
.week .dayhead .d { color: var(--muted); font-weight: 400; font-size: 0.78rem; }
.week .dayhead.today { color: var(--accent); }
.week .dayhead.today .d { color: var(--accent); }
.week .slotlabel { padding: 10px 10px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-top: 1px solid var(--line); }
.week .cell { padding: 8px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); min-height: 88px; display: flex; flex-direction: column; gap: 6px; }
.week .cell.today { background: color-mix(in srgb, var(--accent-soft) 30%, transparent); }
.dish { display: flex; flex-direction: column; gap: 6px; background: var(--surface2); border-radius: 10px; padding: 8px 10px; }
.dish .name { font-size: 0.84rem; font-weight: 600; line-height: 1.25; display: flex; align-items: center; gap: 5px; }
.dish .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; font-size: 0.74rem; color: var(--muted); }
.dish .meta .kcal { margin-left: auto; color: var(--ink); font-size: 0.76rem; }
.dish.leftover { background: none; border: 1px dashed var(--leader); }
.dish.leftover .name { color: var(--muted); font-weight: 500; }
.dish.free { background: none; border: 1px solid var(--line); }
.dish.free .name { color: var(--muted); font-weight: 500; font-style: italic; }
.dish.new { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-soft); }
.dish.dim { opacity: 0.55; }
.add { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 10px; color: var(--leader); opacity: 0.7; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; gap: 2px; }
.seg span { padding: 5px 14px; border-radius: 999px; font-size: 0.86rem; color: var(--muted); white-space: nowrap; }
.seg span.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg.sm span { padding: 6px 10px; font-size: 0.8rem; }

/* ---------- dialogs ---------- */
.backdrop { position: absolute; inset: 0; background: var(--backdrop); }
.modal { position: absolute; left: 50%; top: 72px; transform: translateX(-50%); width: 760px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 20px 24px 24px; }
.modal.wide { width: 1080px; }
.modal.narrow { width: 520px; }
.dlg-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { margin: 0; font-size: 1.05rem; }
.dlg-close { margin-left: auto; color: var(--muted); font-size: 1.1rem; padding: 2px 8px; }
.dlg-foot { display: flex; align-items: center; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }

/* ---------- lists / tables ---------- */
.row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; }
.row.sel { background: var(--accent-soft); }
.row + .row { border-top: 1px solid var(--line); }
.row.sel + .row, .row + .row.sel { border-top-color: transparent; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.tbl th, .tbl td { padding: 9px 14px; text-align: left; white-space: nowrap; }
.tbl thead th { background: var(--surface2); font-weight: 700; font-size: 0.8rem; color: var(--muted); }
.tbl tbody tr + tr td { border-top: 1px solid var(--line); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr.edit td { background: var(--surface2); }
.tbl .in { padding: 4px 8px; font-size: 0.84rem; }

/* ---------- phone ---------- */
.phone { width: 390px; height: 844px; min-height: 844px; padding: 0; display: flex; flex-direction: column; }
.ph-head { padding: 18px 16px 12px; display: flex; align-items: center; gap: 10px; }
.ph-head h1 { font-size: 1.15rem; font-weight: 700; }
.ph-body { flex: 1; padding: 0 16px 100px; display: flex; flex-direction: column; gap: 12px; }
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 78px; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 18px; }
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: 0.66rem; font-weight: 600; border-radius: 12px; }
.tabbar a.current { color: var(--accent); }
.srow { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 4px; }
.srow + .srow { border-top: 1px solid var(--line); }
.srow .nm { flex: 1; font-size: 0.95rem; }
.srow .qty { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
.srow.done .nm, .srow.done .qty { color: var(--muted); text-decoration: line-through; }
.cb { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--leader); flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--accent-ink); }
.cb.on { background: var(--accent); border-color: var(--accent); }
.cb.have { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
.daytabs { display: flex; gap: 6px; overflow: hidden; }
.daytab { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 0; border-radius: 12px; font-size: 0.7rem; color: var(--muted); font-weight: 600; background: var(--surface); border: 1px solid var(--line); }
.daytab b { font-size: 0.95rem; color: var(--ink); font-weight: 700; }
.daytab.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.daytab.on b { color: var(--accent-ink); }
.slotcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.slotcard .lbl { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.slotcard .title { font-size: 1.05rem; font-weight: 700; line-height: 1.25; }
.slotcard.empty { border-style: dashed; box-shadow: none; background: none; }

/* ---------- overview ---------- */
.legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.legend .item { display: flex; flex-direction: column; gap: 8px; }
.legend .item .cap { font-size: 0.82rem; color: var(--muted); line-height: 1.4; }
.flow { display: flex; flex-direction: column; gap: 8px; }
.flow ol { margin: 0; padding-left: 18px; font-size: 0.86rem; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
.flow ol li::marker { color: var(--accent); font-weight: 700; }
  </style>
</helmet>
